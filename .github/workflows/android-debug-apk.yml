name: Compilar APK Android (Debug)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias web
        run: npm ci

      - name: Ejecutar pruebas unitarias de fórmulas
        run: npm test

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Limpiar librerías obsoletas de Cordova
        run: rm -f android/app/libs/framework.jar android/app/libs/framework-*.jar

      - name: Sincronizar proyecto Android con Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK Debug
        run: gradle -p android assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: la-receta-de-don-cangrejo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
